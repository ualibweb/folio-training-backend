description: A book for creation (no ID)
type: object
properties:
  name:
    description: The name of this book
    type: string
  publishedDate:
    type: string
    format: date
    description: When the book was published
  isAvailable:
    description: Is book Available?
    type: boolean
required:
  - name
  - publishedDate
  - isAvailable
